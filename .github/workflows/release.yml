name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          # The section runs from "## [X.Y.Z]" to the next "## [" or to the link references at the bottom.
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP:-/tmp}/notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP:-/tmp}/notes.md"; then
            echo "::error::CHANGELOG.md has no section '## [$version]' or it is empty."
            exit 1
          fi
          gh release create "$TAG" --title "skill-souffleur $version" --notes-file "${RUNNER_TEMP:-/tmp}/notes.md" --verify-tag

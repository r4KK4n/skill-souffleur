name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What goes wrong for you today? A concrete session where it happened helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Souffleur to do

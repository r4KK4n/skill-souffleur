version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Types must match the lowest supported Node (engines: >=22.6).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
